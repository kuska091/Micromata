AWSTemplateFormatVersion: '2010-09-09'
Description: 'Serverless Setup: S3 Bucket und Lambda Funktion'

Resources:
  # 1. S3 Bucket
  MeinS3Bucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      # BucketName: !Sub '${AWS::StackName}-mein-bucket-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled

  # 2. IAM Rolle für Lambda (Ausführungsrechte)
  LambdaExecutionRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'

  # 3. Lambda Funktion
  MeineLambdaFunktion:
    Type: 'AWS::Lambda::Function'
    Properties:
      # FunctionName: !Sub '${AWS::StackName}-meine-funktion'
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.11
      Code:
        ZipFile: |
          import json

          def lambda_handler(event, context):
              print("Lambda wurde erfolgreich aufgerufen!")
              return {
                  'statusCode': 200,
                  'body': json.dumps('Hallo aus der Lambda-Funktion!')
              }

Outputs:
  BucketName:
    Description: 'Name des erstellten S3 Buckets'
    Value: !Ref MeinS3Bucket
  LambdaArn:
    Description: 'ARN der erstellten Lambda Funktion'
    Value: !GetAtt MeineLambdaFunktion.Arn