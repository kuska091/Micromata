AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Detailing Factory Serverless Stack
Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: python3.12
Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: detailing-factory-frontend-${AWS::AccountId}
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
  BackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: BackendFunction
      Handler: main.handler
      Environment:
        Variables:
          JWT_SECRET: sicheres_geheimnis_mind_32_zeichen_lang
          ADMIN_EMAIL: admin@detailing-factory.de
          ADMIN_PASSWORD: dein_admin_passwort
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
    Metadata:
      SamResourceId: BackendFunction
Outputs:
  FrontendBucketName:
    Description: "Name des S3 Buckets f\xFCr das Frontend"
    Value:
      Ref: FrontendBucket
  BackendApiUrl:
    Description: "URL des API Gateways f\xFCr das Backend"
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/
