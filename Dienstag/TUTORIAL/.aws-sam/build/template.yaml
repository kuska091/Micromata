AWSTemplateFormatVersion: '2010-09-09'
Description: 'Serverless Setup: S3 Bucket und Lambda Funktion'
Resources:
  MeinS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  MeineLambdaFunktion:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.lambda_handler
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      Runtime: python3.11
      Code:
        ZipFile: "import json\n\ndef lambda_handler(event, context):\n    print(\"\
          Lambda wurde erfolgreich aufgerufen!\")\n    return {\n        'statusCode':\
          \ 200,\n        'body': json.dumps('Hallo aus der Lambda-Funktion!')\n \
          \   }\n"
Outputs:
  BucketName:
    Description: Name des erstellten S3 Buckets
    Value:
      Ref: MeinS3Bucket
  LambdaArn:
    Description: ARN der erstellten Lambda Funktion
    Value:
      Fn::GetAtt:
      - MeineLambdaFunktion
      - Arn
